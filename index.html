<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de contactos</title>
    <link rel="stylesheet" href="style/login.css">
</head>

<body>

    <div class="container">
        <div class="imagen">
            <img src="https://www.pngall.com/wp-content/uploads/5/Profile-PNG-Pic.png" alt="">
        </div>
        <form action="../contactos.html" method="get">
            <label for="">Correo:
                <input type="email" required placeholder="correo@ejemplo.com">
            </label>
            <label for="">Contraseña:
                <input type="password" required minlength="6" title="La contraseña debe tener al menos 6 caracteres">
            </label>
            <button type="submit">Iniciar sesión</button>
        </form>
    </div>
</body>

</html>
