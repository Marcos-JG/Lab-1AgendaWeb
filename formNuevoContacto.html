<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Contacto</title>
    <link rel="stylesheet" href="style/form.css">
</head>

<body>

    <header class="header">
        <h1>Nuevo Contacto</h1>
        <div>
            <a href="agenda.html" class="botonAtras">Cancelar</a>
        </div>
    </header>

    <main class="contenedor">
        <div class="form">
            <form action="agenda.html" method="get">

                <div class="formCosas">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Marcos García" required>
                </div>

                <div class="formCosas">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Ej: usuario@email.com" required>
                </div>

                <div class="formCosas">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +502 11111 1111">
                </div>
                <div>
                    <button type="submit" class="botonGuardar">Guardar Contacto</button>
                </div>

            </form>
        </div>
    </main>

</body>

</html>
